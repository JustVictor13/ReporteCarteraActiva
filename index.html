<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin Comprar — Marzo 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F4F0;color:#2C2C2A;min-height:100vh}
.shell{max-width:1100px;margin:0 auto;padding:1.5rem 1rem 4rem}
header{background:#1F4E79;color:#fff;padding:1.2rem 1.5rem;border-radius:12px;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:18px;font-weight:500}
header p{font-size:12px;opacity:.75}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid #D3D1C7;margin-bottom:1.5rem}
.tab{padding:8px 18px;font-size:13px;font-weight:500;cursor:pointer;color:#888780;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all .15s;border-radius:4px 4px 0 0}
.tab:hover{color:#2C2C2A;background:#F1EFE8}
.tab.active{color:#1F4E79;border-bottom-color:#1F4E79}
.section{display:none}.section.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.5rem}
@media(max-width:600px){.metrics{grid-template-columns:repeat(3,1fr)}}
.metric{background:#fff;border-radius:10px;padding:1rem;text-align:center;border:0.5px solid #D3D1C7}
.metric-num{font-size:26px;font-weight:600;line-height:1.1;margin-bottom:4px}
.metric-lbl{font-size:11px;color:#888780}
.vendor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:1.5rem}
.vcard{background:#fff;border:0.5px solid #D3D1C7;border-radius:12px;padding:1rem 1.1rem;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.vcard:hover{box-shadow:0 2px 12px rgba(30,78,121,.12);border-color:#2E75B6}
.vc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.vc-name{font-size:14px;font-weight:600;color:#1F4E79}
.vc-total{font-size:12px;color:#888780}
.vc-bar{height:7px;border-radius:4px;display:flex;overflow:hidden;margin-bottom:10px;background:#F1EFE8}
.seg{height:100%}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.health{display:flex;align-items:center;gap:8px}
.hlbl{font-size:11px;color:#888780;min-width:84px}
.htrack{flex:1;height:4px;background:#F1EFE8;border-radius:2px;overflow:hidden}
.hfill{height:100%;border-radius:2px;transition:width .4s}
.hpct{font-size:11px;min-width:28px;text-align:right;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#888780;padding:12px 0;border-top:0.5px solid #D3D1C7;margin-top:4px}
.ldot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.filter-row span{font-size:12px;color:#888780;white-space:nowrap}
.fbtn{font-size:12px;padding:4px 12px;border-radius:12px;border:0.5px solid #B4B2A9;background:#fff;color:#888780;cursor:pointer;transition:all .15s}
.fbtn:hover,.fbtn.active{background:#E6F1FB;color:#185FA5;border-color:#185FA5}
.cat-block{margin-bottom:1.2rem;border-radius:10px;overflow:hidden;border:0.5px solid #D3D1C7}
.cat-hdr{display:flex;align-items:center;gap:10px;padding:.7rem 1rem;cursor:pointer;user-select:none;background:#fff}
.cat-hdr:hover{filter:brightness(.97)}
.cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ctitle{font-size:14px;font-weight:600}
.ccnt{font-size:12px;color:#888780;margin-left:auto;margin-right:6px}
.carrow{font-size:12px;color:#B4B2A9;transition:transform .2s;display:inline-block}
.carrow.open{transform:rotate(90deg)}
.cat-body{overflow:hidden;max-height:0;transition:max-height .4s ease}
.cat-body.open{max-height:99999px}
table.ct{width:100%;border-collapse:collapse;font-size:12px}
table.ct th{padding:7px 10px;text-align:left;background:#2E75B6;color:#fff;font-weight:500;font-size:11px;position:sticky;top:0}
table.ct td{padding:6px 10px;border-bottom:0.5px solid #EEE;vertical-align:top;color:#2C2C2A}
table.ct tr:last-child td{border-bottom:none}
table.ct tr:hover td{background:#F8F8F6}
.pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600}
.p10k{background:#EAF3DE;color:#3B6D11}.p14k{background:#E6F1FB;color:#185FA5}
.note{color:#5F5E5A;font-size:11px}
.no-results{padding:1.5rem;text-align:center;color:#888780;font-size:13px}
.hint{font-size:11px;color:#B4B2A9;font-style:italic}
</style>
</head>

let activeVendor='TODOS';

function showTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function goToVendor(ag){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('categorias').classList.add('active');
  document.querySelectorAll('.tab')[1].classList.add('active');
  setFilter(ag);
  window.scrollTo({top:0,behavior:'smooth'});
}

function setFilter(ag){
  activeVendor=ag;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector(`.fbtn[data-ag="${ag}"]`);
  if(btn) btn.classList.add('active');
  renderCats();
}

function renderMetrics(){
  const t={g:0,b:0,l:0,a:0,r:0};
  V.forEach(v=>{t.g+=v.g;t.b+=v.b;t.l+=v.l;t.a+=v.a;t.r+=v.r;});
  document.getElementById('metrics-global').innerHTML=`
    <div class="metric"><div class="metric-num" style="color:#3B6D11">${t.g}</div><div class="metric-lbl">Ya compraron</div></div>
    <div class="metric"><div class="metric-num" style="color:#185FA5">${t.b}</div><div class="metric-lbl">Pendientes activos</div></div>
    <div class="metric"><div class="metric-num" style="color:#3f7000">${t.l}</div><div class="metric-lbl">Expo / esporádicos</div></div>
    <div class="metric"><div class="metric-num" style="color:#854F0B">${t.a}</div><div class="metric-lbl">Personal / baja</div></div>
    <div class="metric"><div class="metric-num" style="color:#A32D2D">${t.r}</div><div class="metric-lbl">No activos</div></div>`;
}

function renderVendors(){
  document.getElementById('vgrid').innerHTML=V.map(v=>{
    const t=v.g+v.b+v.l+v.a+v.r;
    const pct=Math.round((v.g+v.b)/t*100);
    const pc=pct>=80?'#3B6D11':pct>=60?'#639922':pct>=40?'#854F0B':'#A32D2D';
    return `<div class="vcard" onclick="goToVendor('${v.ag}')" title="Ver detalle de ${v.ag}">
      <div class="vc-top"><span class="vc-name">${v.ag}</span><span class="vc-total">${t} clientes</span></div>
      <div class="vc-bar">
        <div class="seg" style="width:${v.g/t*100}%;background:#639922"></div>
        <div class="seg" style="width:${v.b/t*100}%;background:#185FA5"></div>
        <div class="seg" style="width:${v.l/t*100}%;background:#5a8c00"></div>
        <div class="seg" style="width:${v.a/t*100}%;background:#BA7517"></div>
        <div class="seg" style="width:${v.r/t*100}%;background:#A32D2D"></div>
      </div>
      <div class="badges">
        ${v.g?`<span class="badge" style="background:#EAF3DE;color:#3B6D11">${v.g} compró</span>`:''}
        ${v.b?`<span class="badge" style="background:#E6F1FB;color:#185FA5">${v.b} pendiente</span>`:''}
        ${v.l?`<span class="badge" style="background:#f0f7e0;color:#3f7000">${v.l} expo</span>`:''}
        ${v.a?`<span class="badge" style="background:#FAEEDA;color:#854F0B">${v.a} personal/baja</span>`:''}
        ${v.r?`<span class="badge" style="background:#FCEBEB;color:#A32D2D">${v.r} no activo</span>`:''}
      </div>
      <div class="health">
        <span class="hlbl">Cartera activa</span>
        <div class="htrack"><div class="hfill" style="width:${pct}%;background:${pc}"></div></div>
        <span class="hpct" style="color:${pc}">${pct}%</span>
      </div>
    </div>`;
  }).join('');
}

function toggleCat(id){
  document.getElementById('cb-'+id).classList.toggle('open');
  document.getElementById('ca-'+id).classList.toggle('open');
}

function renderCats(){
  let html=''; let any=false;
  CATS.forEach(cat=>{
    const list=activeVendor==='TODOS'?cat.clients:cat.clients.filter(x=>x.ag===activeVendor);
    if(!list.length) return;
    any=true;
    const rows=list.map(x=>`<tr>
      <td><span style="font-weight:600">${x.cv}</span>${x.nm?`<br><span style="font-size:10px;color:#888780">${x.nm}</span>`:''}
      </td>
      <td><span class="pill p${x.t.replace('K','').toLowerCase()}k">${x.t}</span></td>
      <td style="color:#5F5E5A;white-space:nowrap">${x.ag}</td>
      <td class="note">${x.n}</td>
    </tr>`).join('');
    html+=`<div class="cat-block">
      <div class="cat-hdr" onclick="toggleCat('${cat.id}')" style="border-left:4px solid ${cat.color}">
        <div class="cdot" style="background:${cat.color}"></div>
        <div class="ctitle" style="color:${cat.color}">${cat.label}</div>
        <div class="ccnt">${list.length}</div>
        <div class="carrow open" id="ca-${cat.id}">▶</div>
      </div>
      <div class="cat-body open" id="cb-${cat.id}">
        <table class="ct"><thead><tr>
          <th>Clave / Nombre</th><th>Línea</th><th>Vendedor</th><th>Nota</th>
        </tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>`;
  });
  document.getElementById('catcont').innerHTML = any
    ? html
    : '<div class="no-results">No hay clientes registrados para este vendedor.</div>';
}

function buildFilters(){
  const row=document.getElementById('filter-btns');
  const b0=document.createElement('button');
  b0.className='fbtn active';b0.textContent='Todos';b0.dataset.ag='TODOS';
  b0.onclick=()=>setFilter('TODOS');
  row.appendChild(b0);
  [...new Set(CATS.flatMap(c=>c.clients.map(x=>x.ag)))].sort().forEach(ag=>{
    const b=document.createElement('button');
    b.className='fbtn';b.textContent=ag;b.dataset.ag=ag;
    b.onclick=()=>setFilter(ag);
    row.appendChild(b);
  });
}

renderMetrics();
renderVendors();
buildFilters();
renderCats();
</script>
